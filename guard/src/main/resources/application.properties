server.port=8080
spring.application.name=factoryguard

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:factoryguard}
spring.datasource.username=${DB_USER:factoryguard}
spring.datasource.password=${DB_PASSWORD:factoryguard_dev}
spring.sql.init.mode=always

# Where the demo app lives and how FactoryGuard starts it
guard.container-name=demo-app
guard.network=factoryguard_net
guard.image-name=${GUARD_IMAGE_NAME:factoryguard/demo-app}
guard.published-port=8081
guard.mqtt-host=mosquitto
guard.demo-port=8080
guard.baseline-version=v1.0

# The recovery policy (all can be changed in the .env file)
guard.threshold=${GUARD_THRESHOLD:60}
guard.check-interval-seconds=${GUARD_CHECK_INTERVAL_SECONDS:5}
guard.warmup-seconds=${GUARD_WARMUP_SECONDS:25}
guard.failures-before-rollback=${GUARD_FAILURES_BEFORE_ROLLBACK:3}
guard.healthy-checks-to-promote=6
guard.max-rollbacks-per10-min=${GUARD_MAX_ROLLBACKS_PER_10_MIN:2}
guard.webhook-url=${GUARD_WEBHOOK_URL:}

# Optional: publish metrics to Amazon CloudWatch (turned on automatically in the AWS deployment)
guard.cloudwatch-enabled=${GUARD_CLOUDWATCH_ENABLED:false}
aws.region=${AWS_REGION:}

# Set GUARD_COOKIE_SECURE=true only when the dashboard is served over HTTPS
guard.cookie-secure=${GUARD_COOKIE_SECURE:false}
