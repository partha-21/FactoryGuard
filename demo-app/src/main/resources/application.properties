server.port=8080
spring.application.name=factory-monitor-demo-app

# Release identity (set inside the Docker image)
app.version=${APP_VERSION:dev}
app.bug-mode=${BUG_MODE:false}
# In bug mode every message takes this long to process (about 24 messages/min)
app.bug-delay-ms=2500
# Throughput is measured over this many seconds
app.window-seconds=20

mqtt.host=${MQTT_HOST:mosquitto}
mqtt.topic=factory/sensors

management.endpoints.web.exposure.include=health
