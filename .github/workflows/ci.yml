name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [demo-app, guard, simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: mvn -B verify

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the React dashboard
        working-directory: dashboard
        run: |
          npm install
          npm run build

  end-to-end:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: |
          docker compose --profile images build
          docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Run the end-to-end story (new user, deploy bug, automatic rollback)
        run: python3 scripts/e2e.py
      - name: Keep the evidence file the run produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: docs/EVIDENCE.md
          if-no-files-found: ignore
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Clean up
        if: always()
        run: |
          docker rm -f demo-app || true
          docker compose down -v
